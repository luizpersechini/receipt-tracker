name: CI

# Gate: unit tests + the mock-OCR QA smoke must pass. Both run fully offline
# (no Ollama, no network needed) — the OCR/structuring calls are mocked and
# qa/run_qa.py --ocr mock stubs OCR. See qa/README.md.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13" # app needs 3.10+; 3.13 is the dev version
          cache: pip

      # WeasyPrint's runtime libs — without them the report-PDF tests skip
      # (pytest.importorskip) instead of running.
      - name: Install WeasyPrint system libraries
        run: |
          # Drop the runner's preinstalled Google Chrome apt repo before
          # updating — our deps come only from Ubuntu's own repos, and a
          # hash-sum mismatch in Chrome's index was failing the whole job.
          # Match both .list and deb822 .sources formats; leave ubuntu.sources
          # intact. `|| true` on update so any other unrelated third-party
          # index can't fail the build either — our packages are in the
          # Ubuntu index, which updates fine.
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Dev extra adds pytest + pytest-asyncio (not in requirements.txt,
          # which is runtime-only). requirements.txt already satisfies the
          # looser pyproject runtime pins, so nothing downgrades.
          pip install ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: QA smoke (mock OCR — no Ollama/network)
        run: python qa/run_qa.py --ocr mock
