[project]
name = "receipt-tracker"
version = "1.0.0"
description = "Local-first receipt OCR and corporate-card reconciliation (FastAPI, on-device OCR, Ollama)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luiz Persechini" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "python-multipart>=0.0.6",
    "pillow>=10.1",
    "pillow-heif>=0.13",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j floor
    "ollama>=0.1.6",
    "watchdog>=3.0",
    "beautifulsoup4>=4.12",
    "google-auth>=2.27",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.117",
    "weasyprint>=60",
    "opencv-python-headless>=4.8",
    "pyobjc-framework-vision==11.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz==11.1 ; sys_platform == 'darwin'",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
